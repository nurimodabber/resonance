<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Resonance — Deep Conversation Cards</title>
    <meta
      name="description"
      content="Bilingual deep conversation card decks, constructive reflections, and curated wisdom for warm evenings together."
    />
    <meta name="theme-color" content="#0F1514" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    />
    <script>
      try {
        var t = localStorage.getItem('resonance.theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
        } else {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
